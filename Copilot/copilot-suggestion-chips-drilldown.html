<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retell Copilot — Suggestion chips</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; color: #0A0A0A; background: #fff; height: 100vh; display: flex; }

  /* ===== Left: chat history rail ===== */
  .chats { width: 256px; min-width: 256px; background: #FAFBFC; border-right: 1px solid #ECEFF3; display: flex; flex-direction: column; }
  .chats-top { padding: 16px 14px 10px; }
  .chats-title { font-size: 13px; font-weight: 700; color: #0A0A0A; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .chats-title svg { color: #3d64d7; }
  .newchat { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px; border: 1px solid #E1E4EA; background: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #0E121B; cursor: pointer; }
  .newchat:hover { background: rgba(0,0,0,0.02); }
  .chats-list { flex: 1; overflow-y: auto; padding: 6px 8px 14px; }
  .chat-item { padding: 8px 10px; border-radius: 7px; font-size: 13px; color: #525866; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .chat-item:hover { background: rgba(0,0,0,0.04); }
  .chats-foot { padding: 10px 12px; border-top: 1px solid #ECEFF3; display: flex; align-items: center; gap: 8px; }
  .chats-foot .av { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; }
  .chats-foot .av img { width: 100%; height: 100%; object-fit: cover; }
  .chats-foot .em { font-size: 12.5px; color: #525866; }

  /* ===== Center: blank-state Copilot ===== */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 0 24px; }
  .stage-inner { width: 100%; max-width: 680px; margin-top: -40px; }

  .orb { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 26px;
    background:
      radial-gradient(circle at 34% 30%, #c7d6ff 0%, #7d9bf6 26%, #4f73e6 52%, #2f4fc4 100%);
    box-shadow: 0 8px 26px rgba(61,100,215,0.32), inset 0 -6px 14px rgba(20,40,110,0.45), inset 0 6px 12px rgba(255,255,255,0.55); }

  .greeting { text-align: center; font-size: 23px; font-weight: 700; letter-spacing: -0.02em; color: #0A0A0A; margin-bottom: 24px; }

  /* Composer */
  .composer { border: 1px solid #E5E7EB; border-radius: 16px; box-shadow: 0 1px 3px rgba(16,24,40,0.05); padding: 16px 16px 12px; transition: border-color .12s; }
  .composer:focus-within { border-color: #C9D6F5; }
  .composer .field { font-size: 15px; color: #99A0AE; min-height: 24px; outline: none; }
  .composer .field.filled { color: #0E121B; }
  .composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .plus { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #E5E7EB; background: #fff; color: #525866; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .plus:hover { background: rgba(0,0,0,0.03); }
  .csp { flex: 1; }
  .mode-sel { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid #E5E7EB; background: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #0E121B; cursor: pointer; }
  .mode-sel svg { color: #99A0AE; }
  .send { width: 32px; height: 32px; border-radius: 50%; background: #0E121B; color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
  .send:hover { background: #000; }

  /* ===== Suggestion chips ===== */
  .chips-area { margin-top: 18px; min-height: 86px; }

  /* top-level row */
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid #E5E7EB; background: #fff; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: #1F2430; cursor: pointer; white-space: nowrap; transition: background .1s, border-color .1s; }
  .chip:hover { background: #F7F8FA; border-color: #DCE0E6; }
  .chip svg { color: #525866; flex-shrink: 0; }
  .chip .arrow { color: #99A0AE; margin-left: 2px; }

  /* drill-down */
  .drill { display: none; }
  .drill.show { display: block; }
  .top.hide { display: none; }
  .drill-label { text-align: center; font-size: 12px; font-weight: 600; color: #99A0AE; letter-spacing: 0.02em; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .drill-label svg { color: #99A0AE; }
  .back { display: block; margin: 14px auto 0; background: none; border: none; font-size: 13px; color: #525866; cursor: pointer; }
  .back:hover { color: #0A0A0A; }

  .hint { text-align: center; font-size: 12px; color: #C0C5CE; margin-top: 22px; }
</style>
</head>
<body>

<!-- LEFT: chat history -->
<aside class="chats">
  <div class="chats-top">
    <div class="chats-title"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 1.5L11.7 6.3L16.5 8L11.7 9.7L10 14.5L8.3 9.7L3.5 8L8.3 6.3L10 1.5Z" fill="currentColor"/></svg>Retell Copilot</div>
    <div class="newchat" onclick="resetBlank()"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M9.25 9.25V4.75H10.75V9.25H15.25V10.75H10.75V15.25H9.25V10.75H4.75V9.25H9.25Z" fill="#0E121B"/></svg>New chat</div>
  </div>
  <div class="chats-list">
    <div class="chat-item">Why is my agent cutting off callers</div>
    <div class="chat-item">Add a CSAT survey before hang-up</div>
    <div class="chat-item">Support Spanish callers</div>
    <div class="chat-item">Reduce transfer rate on billing</div>
    <div class="chat-item">Cluster last week's failed calls</div>
  </div>
  <div class="chats-foot">
    <span class="av"><img src="https://lh3.googleusercontent.com/a/ACg8ocJQatnwR_DPG54-_PEdcr_wNiJIL5R6eZBsgMIcPHE5dP1ozMBhpA=s96-c" alt=""></span>
    <span class="em">brandon@retellai.com</span>
  </div>
</aside>

<!-- CENTER: blank state -->
<main class="stage">
  <div class="stage-inner">
    <div class="orb"></div>
    <div class="greeting">Hey Brandon, what are we working on today?</div>

    <!-- Composer -->
    <div class="composer">
      <div class="field" id="field" contenteditable="true" data-ph="Ask Retell to build a customer support agent…" oninput="onType()"></div>
      <div class="composer-bar">
        <span class="plus"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M9.25 9.25V4.75H10.75V9.25H15.25V10.75H10.75V15.25H9.25V10.75H4.75V9.25H9.25Z" fill="#525866"/></svg></span>
        <span class="csp"></span>
        <span class="mode-sel">Build<svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M5.5 8L10 12.5L14.5 8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
        <button class="send"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 16V5M10 5L5.5 9.5M10 5l4.5 4.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>

    <!-- Chips -->
    <div class="chips-area" id="chipsArea">
      <!-- Top-level -->
      <div class="chip-row top" id="topRow">
        <span class="chip" onclick="drill('agents')">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M11.125 2.5C11.125 2.833 10.98 3.133 10.75 3.339V4.75H14.5C15.743 4.75 16.75 5.757 16.75 7V14.5C16.75 15.743 15.743 16.75 14.5 16.75H5.5C4.257 16.75 3.25 15.743 3.25 14.5V7C3.25 5.757 4.257 4.75 5.5 4.75H9.25V3.339C9.02 3.133 8.875 2.833 8.875 2.5C8.875 1.879 9.379 1.375 10 1.375C10.621 1.375 11.125 1.879 11.125 2.5ZM5.5 6.25C5.086 6.25 4.75 6.586 4.75 7V14.5C4.75 14.914 5.086 15.25 5.5 15.25H14.5C14.914 15.25 15.25 14.914 15.25 14.5V7C15.25 6.586 14.914 6.25 14.5 6.25H5.5ZM7.75 11.875C8.371 11.875 8.875 11.371 8.875 10.75C8.875 10.129 8.371 9.625 7.75 9.625C7.129 9.625 6.625 10.129 6.625 10.75C6.625 11.371 7.129 11.875 7.75 11.875ZM12.25 11.875C12.871 11.875 13.375 11.371 13.375 10.75C13.375 10.129 12.871 9.625 12.25 9.625C11.629 9.625 11.125 10.129 11.125 10.75C11.125 11.371 11.629 11.875 12.25 11.875Z" fill="currentColor"/></svg>
          Agents
        </span>
        <span class="chip" onclick="drill('simulations')">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M6 4.5L15 10L6 15.5V4.5Z" fill="currentColor"/></svg>
          Simulations
        </span>
        <span class="chip" onclick="drill('analytics')">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M3.5 14.5L8 9.75L11 12.25L16.5 6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6H16.5V10" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Analytics
        </span>
        <span class="chip" onclick="drill('callhistory')">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2.5C14.1423 2.5 17.5 5.85775 17.5 10C17.5 14.1423 14.1423 17.5 10 17.5C5.85775 17.5 2.5 14.1423 2.5 10H4C4 13.3135 6.6865 16 10 16C13.3135 16 16 13.3135 16 10C16 6.6865 13.3135 4 10 4C7.9375 4 6.118 5.04025 5.03875 6.625H7V8.125H2.5V3.625H4V5.5C5.368 3.6775 7.54675 2.5 10 2.5ZM10.75 6.25V9.68875L13.1823 12.121L12.121 13.1823L9.25 10.3098V6.25H10.75Z" fill="currentColor"/></svg>
          Call History
        </span>
        <span class="chip" onclick="drill('aiqa')">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M14.5232 13.4627L17.7355 16.6742L16.6742 17.7355L13.4627 14.5232C12.2678 15.4812 10.7815 16.0022 9.25 16C5.524 16 2.5 12.976 2.5 9.25C2.5 5.524 5.524 2.5 9.25 2.5C12.976 2.5 16 5.524 16 9.25C16.0022 10.7815 15.4812 12.2678 14.5232 13.4627ZM13.0187 12.9062C13.9706 11.9274 14.5021 10.6153 14.5 9.25C14.5 6.349 12.1502 4 9.25 4C6.349 4 4 6.349 4 9.25C4 12.1502 6.349 14.5 9.25 14.5C10.6153 14.5021 11.9274 13.9706 12.9062 13.0187L13.0187 12.9062Z" fill="currentColor"/><path d="M6.6 9.2L8.2 9.26L9.1 7.6L10.6 10.9L11.5 9.26H13" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          AI QA
        </span>
      </div>

      <!-- Drill-down (one block, content swapped) -->
      <div class="drill" id="drill">
        <div class="drill-label" id="drillLabel"></div>
        <div class="chip-row" id="subRow"></div>
        <button class="back" onclick="back()">← Back</button>
      </div>
    </div>
  </div>
</main>

<script>
  const CATS = {
    agents:      { label: 'Agents', icon: 'M11.125 2.5C11.125 2.833 10.98 3.133 10.75 3.339V4.75H14.5C15.743 4.75 16.75 5.757 16.75 7V14.5C16.75 15.743 15.743 16.75 14.5 16.75H5.5C4.257 16.75 3.25 15.743 3.25 14.5V7C3.25 5.757 4.257 4.75 5.5 4.75H9.25V3.339C9.02 3.133 8.875 2.833 8.875 2.5C8.875 1.879 9.379 1.375 10 1.375C10.621 1.375 11.125 1.879 11.125 2.5Z',
      subs: [
        ['Customer service', 'Build a customer service agent that handles inbound support and answers from our knowledge base'],
        ['Appointment booking', 'Build an appointment booking agent that checks availability and schedules callers'],
        ['Lead qualification', 'Build a lead qualification agent that scores inbound callers and routes hot leads'],
        ['Outbound sales', 'Build an outbound sales agent that follows up on warm leads and books demos'],
      ]},
    simulations: { label: 'Simulations', icon: 'M6 4.5L15 10L6 15.5V4.5Z',
      subs: [
        ['Test call', 'Run a test call against my agent and show me the transcript'],
        ['Edge cases', 'Simulate edge cases like silent callers, background noise, and interruptions'],
        ['Compare agents', 'Compare two agent versions on the same set of test calls'],
        ['LLM eval', 'Set up an LLM eval to score my agent’s responses against a rubric'],
      ]},
    analytics:   { label: 'Analytics', icon: 'M3.5 14.5L8 9.75L11 12.25L16.5 6',
      subs: [
        ['Analyze last 7 days', 'Analyze my last 7 days of calls and surface the biggest changes'],
        ['Custom breakdown', 'Break down my calls by outcome, agent, and disconnection reason'],
        ['Compare versions', 'Compare performance across my last two agent versions'],
        ['Attribute conversion', 'Attribute conversions back to the calls and agents that drove them'],
      ]},
    callhistory: { label: 'Call History', icon: 'M10 2.5C14.1423 2.5 17.5 5.85775 17.5 10C17.5 14.1423 14.1423 17.5 10 17.5C5.85775 17.5 2.5 14.1423 2.5 10H4C4 13.3135 6.6865 16 10 16C13.3135 16 16 13.3135 16 10C16 6.6865 13.3135 4 10 4C7.9375 4 6.118 5.04025 5.03875 6.625H7V8.125H2.5V3.625H4V5.5C5.368 3.6775 7.54675 2.5 10 2.5ZM10.75 6.25V9.68875L13.1823 12.121L12.121 13.1823L9.25 10.3098V6.25H10.75Z',
      subs: [
        ['What’s failing this week', 'What’s failing this week? Group the failed calls by cause'],
        ['Diagnose a call', 'Diagnose this call and tell me why it went wrong'],
        ['Cluster failures', 'Cluster my failed calls into themes and rank them by volume'],
        ['Find failed calls', 'Find calls where the caller hung up during identity verification'],
      ]},
    aiqa:        { label: 'AI QA', icon: 'M14.5232 13.4627L17.7355 16.6742L16.6742 17.7355L13.4627 14.5232C12.2678 15.4812 10.7815 16.0022 9.25 16C5.524 16 2.5 12.976 2.5 9.25C2.5 5.524 5.524 2.5 9.25 2.5C12.976 2.5 16 5.524 16 9.25C16.0022 10.7815 15.4812 12.2678 14.5232 13.4627Z',
      subs: [
        ['Review latest cohort', 'Review my latest QA cohort and summarize how it scored'],
        ['Fix a weak metric', 'Find my weakest QA metric and suggest a fix'],
        ['Walk failed calls', 'Walk me through the calls that failed QA this cohort'],
        ['Benchmark a score', 'Benchmark this cohort’s score against the previous one'],
      ]},
  };

  const topRow = document.getElementById('topRow');
  const drillEl = document.getElementById('drill');
  const subRow = document.getElementById('subRow');
  const drillLabel = document.getElementById('drillLabel');
  const field = document.getElementById('field');

  function drill(key) {
    const cat = CATS[key];
    drillLabel.innerHTML = `<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="${cat.icon}" ${key==='analytics' ? 'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"' : 'fill="currentColor"'}/></svg>${cat.label}`;
    subRow.innerHTML = cat.subs.map(([label, prefill]) =>
      `<span class="chip" onclick="prefill(this, \`${prefill.replace(/`/g,'')}\`)">${label}<span class="arrow">→</span></span>`
    ).join('');
    topRow.classList.add('hide');
    drillEl.classList.add('show');
  }

  function back() {
    drillEl.classList.remove('show');
    topRow.classList.remove('hide');
  }

  function prefill(el, text) {
    field.textContent = text;
    field.classList.add('filled');
    field.focus();
    // place caret at end
    const r = document.createRange(); r.selectNodeContents(field); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    hideChips();
  }

  function onType() {
    const has = field.textContent.trim().length > 0;
    field.classList.toggle('filled', has);
    if (has) hideChips();
  }

  function hideChips() {
    document.getElementById('chipsArea').style.display = 'none';
  }

  function resetBlank() {
    field.textContent = '';
    field.classList.remove('filled');
    document.getElementById('chipsArea').style.display = '';
    back();
  }

  // placeholder behavior for contenteditable
  const style = document.createElement('style');
  style.textContent = '.field:empty:before{content:attr(data-ph);color:#99A0AE;}';
  document.head.appendChild(style);
</script>

</body>
</html>
